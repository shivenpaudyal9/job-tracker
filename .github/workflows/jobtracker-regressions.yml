name: Job Tracker Correctness Regression Tests

on:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/jobs/**'
      - 'backend/scrapers/**'
      - 'backend/tests/**'
      - '.github/workflows/jobtracker-regressions.yml'
  workflow_dispatch:

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install sqlalchemy pytest python-dotenv requests beautifulsoup4 lxml cloudscraper
      - name: Compile changed Python modules
        run: |
          python -m compileall -q backend/app/extractor.py backend/app/processor.py backend/app/routers/jmi.py backend/app/job_freshness.py backend/jobs/daily_scrape.py backend/scrapers
      - name: Run focused tests
        run: |
          python -m pytest -q backend/tests/test_job_freshness.py backend/tests/test_email_relevance.py backend/tests/test_scraper_runner.py
