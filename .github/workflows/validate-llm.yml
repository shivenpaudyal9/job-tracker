name: Validate email extraction fix

on:
  push:
    branches:
      - fix/ground-llm-extractions-and-review-status-20261029
  workflow_dispatch:

jobs:
  test-llm-extraction:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./jobtracker_test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install pytest==7.4.4 sqlalchemy==2.0.25 python-dotenv==1.0.0 beautifulsoup4==4.12.2 python-dateutil==2.9.0.post0
      - name: Run LLM extraction regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_llm_validation.py tests/test_llm_policy_eval.py tests/test_unwrapper.py
